name: CI

# Continuous integration for gmail-mcp-server (HLD §23).
# Pipeline: install -> typecheck -> lint -> format -> unit/integration tests ->
# build -> package smoke test, plus a secret-scanning job. No real Gmail
# credentials are ever used, and live Gmail tests never run here (§22.3).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only need to read the repository contents.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    env:
      # Belt and suspenders: ensure live Gmail tests stay opt-in only (§22.3).
      GMAIL_MCP_LIVE_TESTS: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit + integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package smoke test
        run: npm run smoke

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the scanner can inspect every commit on a push/PR.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
